# cship (https://cship.dev) statusline for Claude Code
# usage_limits formats use {curly} placeholders; other module formats use $value

[cship]
lines = [
  "$cship.context_bar $cship.usage_limits $cship.cost",
  "$cship.model $cship.effort $cship.vim",
  "$directory $git_branch $git_status",
]

[cship.context_bar]
format = "Ctx: $value"

[cship.usage_limits]
five_hour_format = "Session: {pct}% (resets {reset}, pace {pace})"
seven_day_format = "Weekly: {pct}%"
warn_threshold = 60
warn_style = "yellow"
critical_threshold = 85
critical_style = "bold red"

[cship.cost]
format = "Cost: $value"
warn_threshold = 5
warn_style = "yellow"
critical_threshold = 20
critical_style = "bold red"

[cship.model]
# Starship defaults clash with plain color names here: directory=bold cyan,
# git_branch=bold purple, git_status=bold red. Use truecolor hex to stay distinct.
format = "[Model: $value]($style)"
style = "bold"
haiku_style = "bold fg:#9ece6a"
sonnet_style = "bold fg:#7aa2f7"
opus_style = "bold fg:#e0af68"

[cship.effort]
format = "[Effort: $value]($style)"
style = "dim"
high_style = "yellow"
xhigh_style = "bold yellow"
max_style = "bold red"

[cship.vim]
format = "Vim: $value"
