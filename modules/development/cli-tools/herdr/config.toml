onboarding = false

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[ui]
agent_panel_sort = "spaces"

[keys]
# tmux-trained muscle memory. Costs ctrl+a in shells (beginning-of-line;
# use Home) and vim's increment — ctrl+space was rejected because it is
# LazyVim's completion trigger.
prefix = "ctrl+a"

# vim-herdr-navigation: ctrl+h/j/k/l move pane focus, but are forwarded into
# panes running vim so Neovim splits and herdr panes share one set of keys
# (the Neovim side lives in the lazyvim config, loaded via config/keymaps.lua).
# Requires the herdr plugin: `herdr plugin install paulbkim-dev/vim-herdr-navigation`
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
