# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# This file is an out-of-store symlink into the dotfiles repo, so an edit is live the
# moment it is saved; auto-reload makes AeroSpace pick it up without a reload-config
# call. Two gotchas: this is a top-level key, so it must stay above every table (put it
# below one and TOML scopes it into that table — 'Unknown key'), and the watcher only
# starts after one manual reload, so run 'aerospace reload-config' once after adopting it.
auto-reload-config = true

# 'break' and 'shelf' are the workspaces AeroSpace itself knows about — the
# domain-independent ones (see desk-model note below). Keep them alive even when
# empty and invisible, matching what config-version = 1 inferred automatically
# from this file's keybindings.
persistent-workspaces = ['break', 'shelf']

# Desk model: each desk (domain) owns one AeroSpace workspace, switched exclusively
# via the desk CLI — never bind desk switching to an AeroSpace key here. A window's
# default home is its own desk's tiled surface (no on-window-detected rule needed).
# Three exceptions, all domain-independent (design D6 addendum, wagon-scope revision):
#   - floating windows are the "wagon": they follow you across desk switches instead
#     of staying tiled on one desk.
#   - 'break' is the shared workspace (bound to alt-b) for life/comms apps that don't
#     belong to a single desk. Its residents are floating — room furniture, not
#     wagon passengers: desk (wagon-scope) excludes break/shelf from carry by
#     workspace, so floating no longer means "gets swept along" for them. Floating
#     also lets a break resident be peeked from whichever desk is active (Yoink
#     handles drag-and-drop across the switch — its panel is invisible to AeroSpace).
#   - 'shelf' is the reference surface, pinned to a non-main monitor by the
#     force-assignment below when one exists. Same rule as break: residents are
#     floating, not carried (desk excludes break/shelf from carry). Desks and break
#     time-share the main monitor; the shelf sits off to the side when a side
#     monitor exists, and otherwise time-shares main like break does, reached via
#     alt-s (peek, then alt-tab back). A desk gets no force-assignment (D8: no
#     domain names in this layer) — desk switch moves the active desk onto main at
#     runtime instead.

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# Pin the domain-independent workspaces to monitors. The shelf fallback array covers
# every rig from one line: home (1 external + built-in) and clamshell (2 external)
# resolve 'secondary'; the lid-open 3-way (2 external + built-in) has no 'secondary'
# (that pattern is 2-monitor-only) and falls through to 'built-in'. The spare face on
# a 3-way rig is left unassigned — the desk self-heals onto main on the next switch.
[workspace-to-monitor-force-assignment]
break = 'main'
shelf = ['secondary', 'built-in']

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Desk switching itself happens via the desk CLI, not AeroSpace workspace keys.
# 'break' and 'shelf' are the shared, domain-independent workspaces — see the
# desk-model note near the top of this file. See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-b = 'workspace break'
# Peek at the shelf and return with alt-tab (workspace-back-and-forth). On a
# single-monitor rig the shelf has no side monitor to sit on, so this is the
# way to glance at reference material; cross-workspace drag-and-drop goes
# through Yoink (its panel is invisible to AeroSpace and survives switches).
alt-s = 'workspace shelf'
# Send the focused window to 'break' / 'shelf' (the on-window-detected rules
# below only place windows at launch; these are the manual escape hatches).
# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-b = 'move-node-to-workspace break'
alt-shift-s = 'move-node-to-workspace shelf'

alt-shift-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# on-window-detected places a window at launch only (alt-b / alt-shift-b are the
# manual escape hatches for the rest). A window with no rule stays on its own desk,
# tiled — that is the default and the common case. The rules below are only for the
# three domain-independent categories (design D6 addendum, wagon-scope revision).
# Sort a window by asking, in order:
#
#   1. Wagon  — is it a TOOL I keep using no matter which desk I'm at?
#               → floating, no workspace assignment. desk switch drags it along.
#   2. Shelf  — is it REFERENCE material I want in view but don't drive?
#               → floating, pinned to 'shelf'. desk (wagon-scope) excludes break/shelf
#                 from carry by workspace, so it stays put across switches — room
#                 furniture, not a wagon passenger — while still being peekable
#                 (alt-s) or a drag-and-drop target (Yoink) from whichever desk is active.
#   3. Break  — is it PERSONAL life/comms, off the clock?
#               → floating, pinned to 'break', the shared off-desk room reached by
#                 alt-b. Same carry exclusion as shelf.
#
# floating now means two different things depending on workspace: on a desk it's the
# carry marker (wagon), on break/shelf it's settled furniture that desk's carry logic
# explicitly skips by workspace. Tiled with no rule = the plain desk-scoped default.
#
# One rule per category, not one per app: the bundle-id list IS the rule, so there is no
# separate list that could drift out of sync with it. Sorting a new app means dropping
# its id into the right alternation and saving — auto-reload does the rest. Three points
# of mechanics, all load-bearing:
#   - the regex must be double-quoted inside the single-quoted expression. '\.' reads as
#     an escape in AeroSpace's shell expression language and '$' is reserved in a bare
#     word; neither survives outside the inner quotes.
#   - '~=' is a containment match, so anchor with ^...$ — otherwise 'com.foo' also
#     matches 'com.foobar'.
#   - only the first matching callback runs (no check-further-callbacks here), so the
#     three sets must stay disjoint; an id listed twice silently loses its second home.
# Menu-bar agents and overlays (Raycast, Bartender, CleanShot X, Yoink, FineTune, …) never
# reach these callbacks at all — a rule for one of them is dead weight, not a safe no-op.

# Wagon — a tool used across desks; floating so desk switch carries it along
# Finder · 1Password · Aqua Voice · Claude · ChatGPT · ChatGPT Classic · Typeless ·
# Todoist · Heptabase · Logseq · Obsidian
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com\.apple\.finder|com\.1password\.1password|com\.electron\.aqua-voice|com\.anthropic\.claudefordesktop|com\.openai\.codex|com\.openai\.chat|now\.typeless\.desktop|com\.todoist\.mac\.Todoist|app\.projectmeta\.projectmeta|com\.logseq\.logseq|md\.obsidian)$"'
run = 'layout floating'

# Break — personal life/comms, off the clock; floating, pinned to the shared 'break' workspace
# Calendar · Reminders · Things3 · LINE · Messages · Beeper · Rakuten Link · Discord · Music · Spotify
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com\.apple\.iCal|com\.apple\.reminders|com\.culturedcode\.ThingsMac|jp\.naver\.line\.mac|com\.apple\.MobileSMS|im\.beeper|jp\.co\.rakuten\.link|com\.hnc\.Discord|com\.apple\.Music|com\.spotify\.client)$"'
run = ['move-node-to-workspace break', 'layout floating']

# Shelf — reference kept in view but not driven; floating, pinned to the off-monitor 'shelf'
# Preview · Books · Amazon Kindle · Zotero
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com\.apple\.Preview|com\.apple\.iBooksX|com\.amazon\.Lassen|org\.zotero\.zotero)$"'
run = ['move-node-to-workspace shelf', 'layout floating']

